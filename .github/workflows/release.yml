name: Release

# Pushing a `v*` tag (e.g. `v0.2.0`, `v0.2.0-test`) cuts a draft GitHub Release:
# changelog from conventional commits, plus the compiled contract WASM and CLI
# binaries attached as artifacts. Version bumps to Cargo.toml happen before the
# tag is pushed (that's what's being released), not inside this workflow.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG.md

  verify-version:
    name: Verify tag matches Cargo.toml/package.json versions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compare tag version with Cargo.toml/package.json
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CLI_VERSION=$(grep -m1 '^version' cli/trellis_cli/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          CONTRACT_VERSION=$(grep -m1 '^version' contracts/trellis_core/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          FRONTEND_VERSION=$(node -p "require('./frontend/package.json').version")

          echo "Tag version:      $TAG_VERSION"
          echo "CLI version:      $CLI_VERSION"
          echo "Contract version: $CONTRACT_VERSION"
          echo "Frontend version: $FRONTEND_VERSION"

          MISMATCH=0
          [ "$TAG_VERSION" = "$CLI_VERSION" ] || { echo "::error::Tag version ($TAG_VERSION) does not match cli/trellis_cli/Cargo.toml version ($CLI_VERSION)"; MISMATCH=1; }
          [ "$TAG_VERSION" = "$CONTRACT_VERSION" ] || { echo "::error::Tag version ($TAG_VERSION) does not match contracts/trellis_core/Cargo.toml version ($CONTRACT_VERSION)"; MISMATCH=1; }
          [ "$TAG_VERSION" = "$FRONTEND_VERSION" ] || { echo "::error::Tag version ($TAG_VERSION) does not match frontend/package.json version ($FRONTEND_VERSION)"; MISMATCH=1; }

          if [ "$MISMATCH" -eq 1 ]; then
            echo "::error::Version mismatch between git tag and Cargo.toml/package.json. Bump the versions before tagging."
            exit 1
          fi

  build-contract:
    name: Build contract WASM
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build trellis_core WASM
        # `cargo rustc` targeting wasm32-unknown-unknown, not `stellar contract
        # build` (wasm32v1-none) — see DEPLOYMENT.md for why.
        run: |
          cargo rustc \
            --frozen \
            --manifest-path=contracts/trellis_core/Cargo.toml \
            --crate-type=cdylib \
            --target=wasm32-unknown-unknown \
            --release

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: trellis_core-wasm
          path: target/wasm32-unknown-unknown/release/trellis_core.wasm

  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: trellis
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: trellis
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: trellis.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build trellis CLI
        run: cargo build --frozen --release --manifest-path=cli/trellis_cli/Cargo.toml --target=${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/trellis-${{ matrix.target }}${{ matrix.bin == 'trellis.exe' && '.exe' || '' }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: trellis-cli-${{ matrix.target }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: [changelog, build-contract, build-cli]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          find artifacts/trellis_core-wasm artifacts/trellis-cli-* -type f -print0 |
            while IFS= read -r -d '' f; do
              sha256sum "$f" | sed "s|$(dirname "$f")/||" > "$f.sha256"
            done

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign artifacts and checksums
        run: |
          set -euo pipefail
          find artifacts/trellis_core-wasm artifacts/trellis-cli-* -type f ! -name '*.asc' -print0 |
            while IFS= read -r -d '' f; do
              gpg --batch --yes --detach-sign --armor -o "$f.asc" "$f"
            done

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.changelog.outputs.version }}
          body_path: artifacts/changelog/CHANGELOG.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/trellis_core-wasm/*
            artifacts/trellis-cli-x86_64-unknown-linux-gnu/*
            artifacts/trellis-cli-x86_64-apple-darwin/*
            artifacts/trellis-cli-x86_64-pc-windows-msvc/*
