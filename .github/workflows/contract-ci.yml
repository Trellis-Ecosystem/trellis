name: Contract CI

on:
  push:
    branches: [master, main]
    paths:
      - 'contracts/**'
      - 'cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/contract-ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'contracts/**'
      - 'cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/contract-ci.yml'
  schedule:
    # Weekly supply-chain scan — every Monday at 06:00 UTC.
    # Runs even when no code changes to catch newly published advisories.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: contract-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  semgrep:
    name: Semgrep SAST scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep/soroban-rules.yaml

  supply-chain:
    name: Dependency vulnerability scan (cargo audit + cargo deny)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      # cargo-audit checks the dependency graph against the RustSec advisory
      # database.  The ignore list in .cargo/audit.toml mirrors deny.toml so
      # both tools agree on which transitive unmaintained-crate notices are
      # accepted.
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run cargo audit
        run: cargo audit --config .cargo/audit.toml

      # cargo-deny enforces the full supply-chain policy: advisories (RustSec),
      # licence allowlist, duplicate-version warnings, wildcard bans, and
      # source registry restrictions.  Policy lives in deny.toml.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo deny check
        run: cargo deny check

      - name: Report findings on failure
        if: failure()
        run: |
          echo "::error::Supply-chain check failed."
          echo "Run 'cargo audit' and 'cargo deny check' locally to review the findings."
          echo "If a finding is a known false positive, add it to .cargo/audit.toml"
          echo "and deny.toml with a justification comment."

  verify:
    name: Build, test, clippy & fmt
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (native)
        run: cargo build --workspace

      - name: Build contract (wasm32)
        run: cargo build --package trellis_core --target wasm32-unknown-unknown --release

      - name: Test
        run: cargo test --workspace

      - name: Validate test snapshots are up to date
        run: |
          SOROBAN_TEST_SNAPSHOT_FILE=overwrite cargo test --manifest-path contracts/trellis_core/Cargo.toml
          if ! git diff --exit-code contracts/trellis_core/test_snapshots/; then
            echo ""
            echo "ERROR: Test snapshots are out of date."
            echo "Run 'make test-snapshots-update' locally and commit the updated snapshots."
            exit 1
          fi

  cli-integration:
    name: CLI integration tests (local devnet)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install stellar CLI
        run: |
          curl -sL -o stellar-cli.tar.gz https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf stellar-cli.tar.gz
          sudo mv stellar /usr/local/bin/stellar
          stellar --version

      - name: Run CLI integration tests
        run: bash tests/cli_integration/run.sh
