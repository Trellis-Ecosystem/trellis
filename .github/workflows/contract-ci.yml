name: Contract CI

on:
  push:
    branches: [master, main]
    paths:
      - 'contracts/**'
      - 'cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/contract-ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'contracts/**'
      - 'cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/contract-ci.yml'
  workflow_dispatch:

concurrency:
  group: contract-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Build, test, clippy & fmt
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (native)
        run: cargo build --workspace

      - name: Build contract (wasm32)
        run: cargo build --package trellis_core --target wasm32-unknown-unknown --release

      - name: Test
        run: cargo test --workspace

  supply-chain:
    name: Dependency audit (cargo-deny & cargo-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # cargo-deny and cargo-audit are CI-only tools — installed here as
      # prebuilt binaries, never added to any crate's [dependencies].
      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      # Enforces deny.toml at the project root: RustSec advisories, the
      # licence allowlist, the duplicate-version check, and source registries.
      - name: cargo deny check
        run: cargo deny check

      # Second, independent pass against the RustSec advisory database so a
      # newly disclosed vulnerability fails the build even if deny.toml drifts.
      # The ignore list lives in .cargo/audit.toml (mirrors deny.toml).
      - name: cargo audit
        run: cargo audit --deny warnings
