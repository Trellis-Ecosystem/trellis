name: Cargo Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Weekly dependency vulnerability scan
    runs-on: ubuntu-latest

    env:
      # cargo-audit is installed as a binary and does not compile the
      # workspace, so run it under the latest stable rustc. Without this,
      # rustup honours the rust-toolchain.toml pin (1.86), which current
      # cargo-audit releases reject (they require rustc >= 1.88). Mirrors the
      # supply-chain job in contract-ci.yml.
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run cargo audit
        # Same ignore list as contract-ci.yml's supply-chain job.
        run: cargo audit --config .cargo/audit.toml

      - name: Report findings
        if: failure()
        run: echo "Vulnerability audit failed - check the logs above for details"
